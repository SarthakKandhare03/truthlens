<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450">
  <defs>
    <radialGradient id="red" cx="0.12" cy="0.45" r="0.45"><stop offset="0" stop-color="#ff2d55" stop-opacity="0.35"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue" cx="0.9" cy="0.3" r="0.45"><stop offset="0" stop-color="#3c5aff" stop-opacity="0.32"/><stop offset="1" stop-color="#3c5aff" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#fff" opacity="0.07"/></pattern>
    <pattern id="tape" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="22" height="44" fill="#ffd60a"/><rect x="22" width="22" height="44" fill="#111"/></pattern>
  </defs>
  <style>
    .cut { transform: rotate(var(--r)); animation: jig 2.4s ease-in-out infinite; }
    @keyframes jig { 0%,100% { transform: rotate(var(--r)); } 50% { transform: translateY(-7px) rotate(calc(var(--r) * -1)); } }
    .stamp { animation: thump 3s ease-in-out infinite; transform-origin: 1115px 370px; }
    @keyframes thump { 0%,22%,100% { transform: rotate(-12deg) scale(1); } 11% { transform: rotate(-12deg) scale(1.15); } }
    .flash { animation: flash 5s linear infinite; }
    @keyframes flash { 0%,95% { opacity: 0; } 96.5% { opacity: 0.75; } 100% { opacity: 0; } }
    .tape { animation: crawl 2s linear infinite; }
    @keyframes crawl { to { transform: translateX(62.2px); } }
  </style>
  <rect width="1280" height="450" fill="#07070a"/>
  <rect width="1280" height="450" fill="url(#red)"/><rect width="1280" height="450" fill="url(#blue)"/>
  <rect width="1280" height="450" fill="url(#dots)"/>
  <g transform="rotate(-2.5 640 40)"><rect class="tape" x="-120" y="18" width="1520" height="34" fill="url(#tape)"/></g>
  <rect x="150" y="92" width="560" height="34" fill="#f3ead8" transform="rotate(-1 150 92)"/>
  <text x="164" y="116" font-family="'Courier New', monospace" font-size="20" fill="#1a1714" transform="rotate(-1 150 92)">We have your photo. We know where it's been.</text>
  
  <g class="cut" style="animation-delay:-0.00s; transform-origin:199px 211px; --r:-3deg">
    <rect x="156" y="156" width="98" height="122" fill="#000" opacity="0.55"/>
    <rect x="150" y="150" width="98" height="122" fill="#f5f3ef"/>
    <text x="199.0" y="252" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#111114">T</text>
  </g>
  <g class="cut" style="animation-delay:-0.21s; transform-origin:308px 223px; --r:4deg">
    <rect x="260" y="162" width="108" height="134" fill="#000" opacity="0.55"/>
    <rect x="254" y="156" width="108" height="134" fill="#bfe3ff"/>
    <text x="308.0" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="108" fill="#111114">R</text>
  </g>
  <g class="cut" style="animation-delay:-0.42s; transform-origin:426px 234px; --r:-2deg">
    <rect x="374" y="168" width="116" height="144" fill="#000" opacity="0.55"/>
    <rect x="368" y="162" width="116" height="144" fill="#1d1d24"/>
    <text x="426.0" y="286" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="118" fill="#f5f3ef">U</text>
  </g>
  <g class="cut" style="animation-delay:-0.63s; transform-origin:542px 232px; --r:5deg">
    <rect x="496" y="174" width="103" height="128" fill="#000" opacity="0.55"/>
    <rect x="490" y="168" width="103" height="128" fill="#3c5aff"/>
    <text x="541.5" y="276" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="102" fill="#ffffff">T</text>
  </g>
  <g class="cut" style="animation-delay:-0.84s; transform-origin:654px 243px; --r:-1deg">
    <rect x="605" y="180" width="111" height="138" fill="#000" opacity="0.55"/>
    <rect x="599" y="174" width="111" height="138" fill="#ffd23f"/>
    <text x="654.5" y="292" text-anchor="middle" font-family="Georgia, serif" font-weight="900" font-size="112" fill="#111114">H</text>
  </g>
  <g class="cut" style="animation-delay:-1.05s; transform-origin:765px 211px; --r:6deg">
    <rect x="722" y="156" width="98" height="122" fill="#000" opacity="0.55"/>
    <rect x="716" y="150" width="98" height="122" fill="#ff2d55"/>
    <text x="765.0" y="252" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#ffffff">L</text>
  </g>
  <g class="cut" style="animation-delay:-1.26s; transform-origin:874px 223px; --r:0deg">
    <rect x="826" y="162" width="108" height="134" fill="#000" opacity="0.55"/>
    <rect x="820" y="156" width="108" height="134" fill="#f5f3ef"/>
    <text x="874.0" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="108" fill="#111114">E</text>
  </g>
  <g class="cut" style="animation-delay:-1.47s; transform-origin:992px 234px; --r:-6deg">
    <rect x="940" y="168" width="116" height="144" fill="#000" opacity="0.55"/>
    <rect x="934" y="162" width="116" height="144" fill="#bfe3ff"/>
    <text x="992.0" y="286" text-anchor="middle" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="118" fill="#111114">N</text>
  </g>
  <g class="cut" style="animation-delay:-1.68s; transform-origin:1108px 232px; --r:1deg">
    <rect x="1062" y="174" width="103" height="128" fill="#000" opacity="0.55"/>
    <rect x="1056" y="168" width="103" height="128" fill="#1d1d24"/>
    <text x="1107.5" y="276" text-anchor="middle" font-family="'Courier New', monospace" font-weight="900" font-size="102" fill="#f5f3ef">S</text>
  </g>
  <text x="152" y="354" font-family="'Courier New', monospace" font-weight="700" font-size="25" fill="#f5f3ef">Every pixel has a witness.</text>
  <text x="152" y="388" font-family="'Courier New', monospace" font-weight="700" font-size="25" fill="#ffd23f">Sealed at the shutter. Proven on-chain. Checked live.</text>
  <text x="152" y="422" font-family="'Courier New', monospace" font-size="17" fill="#a8a295">SHA-256 · ECDSA P-256 · perceptual hash · Solidity · live camera verify</text>
  <g class="stamp">
    <rect x="1020" y="332" width="190" height="78" fill="none" stroke="#ff2d55" stroke-width="5"/>
    <text x="1115" y="378" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="40" fill="#ff2d55">VERIFIED</text>
    <text x="1115" y="401" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="14" letter-spacing="5" fill="#ff2d55">ON-CHAIN</text>
  </g>
  <rect class="flash" width="1280" height="450" fill="#fff" opacity="0"/>
</svg>
